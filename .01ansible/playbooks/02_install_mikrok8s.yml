---
- name: Install MicroK8s on all nodes
  hosts: all
  become: yes
  tasks:
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Load necessary kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
        state: present

    - name: Check snap core status
      ansible.builtin.command: snap list core
      register: snap_core_status
      failed_when: false
      changed_when: false

    - name: Ensure snap’s core is up-to-date
      ansible.builtin.command: snap install core --classic
      when: snap_core_status.rc != 0

    - name: Check if MicroK8s is installed
      ansible.builtin.command: snap list microk8s
      register: microk8s_installed
      failed_when: false
      changed_when: false

    - name: Install MicroK8s
      ansible.builtin.command: snap install microk8s --classic
      when: microk8s_installed.rc != 0

    - name: Ensure current user is in the microk8s group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: microk8s
        append: yes

    - name: Wait for MicroK8s to be ready
      ansible.builtin.shell: microk8s status --wait-ready
      args:
        executable: /bin/bash

- name: Initialize MicroK8s cluster
  hosts: controlplanes
  become: yes
  tasks:
    - name: Enable common services
      ansible.builtin.shell: microk8s enable dns dashboard storage

    - name: Generate the join command (Manual Construction)
      ansible.builtin.command: microk8s add-node --token-ttl 600
      register: add_node_output
      changed_when: true

    - name: Extract token and ip-port
      ansible.builtin.set_fact:
        join_command_details: "{{ add_node_output.stdout_lines | select('search', 'microk8s join') | first }}"

- name: Join MicroK8s Workers
  hosts: workers
  become: yes
  tasks:
    - name: Attempt to join the MicroK8s cluster
      ansible.builtin.shell: "{{ hostvars[groups['controlplanes'][0]].join_command_details }}"
      register: join_attempt
      ignore_errors: true

    - name: Check join attempt outcome
      ansible.builtin.debug:
        msg: "Join attempt outcome: {{ join_attempt.stdout }}"
      when: join_attempt.rc != 0

    - name: Acknowledge if node is already part of the cluster
      ansible.builtin.debug:
        msg: "Node is already part of the cluster or another error occurred."
      when: "'already known to dqlite' in join_attempt.stdout or join_attempt.rc != 0"